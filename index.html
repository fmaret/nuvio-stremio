<!doctype html>
<html lang="en" class="no-flex-gap no-css-grid no-css-math no-backdrop-filter no-aspect-ratio">
  <head>
    <meta charset="UTF-8" />
    <meta http-equiv="X-UA-Compatible" content="IE=edge" />
    <meta
      name="viewport"
      content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no"
    />
    <script src="assets/runtime/legacy-features.js"></script>
    <script>
      (function configureTizenLaunch() {
        var root = typeof globalThis !== "undefined" ? globalThis : window;
        var search = String((window.location && window.location.search) || "").toLowerCase();
        var userAgent = String(
          (window.navigator && window.navigator.userAgent) || ""
        ).toLowerCase();
        var webapis = root.webapis || {};
        var isTizenLaunch = Boolean(
          root.__NUVIO_PLATFORM__ === "tizen" ||
          root.tizen ||
          root.avplay ||
          webapis.avplay ||
          webapis.avPlay ||
          webapis.productinfo ||
          search.indexOf("wrapper=tizen") !== -1 ||
          userAgent.indexOf("tizen") !== -1
        );

        if (!isTizenLaunch) {
          return;
        }

        root.__NUVIO_PLATFORM__ = "tizen";
        var viewport = document.querySelector("meta[name='viewport']");
        if (!viewport) {
          viewport = document.createElement("meta");
          viewport.name = "viewport";
          document.head.appendChild(viewport);
        }
        viewport.setAttribute(
          "content",
          "width=1920, height=1080, initial-scale=1.0, maximum-scale=1.0, user-scalable=no"
        );
      })();
    </script>
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <title>Nuvio TV</title>

    <link rel="stylesheet" href="css/base.css?v=20260509s" />
    <link rel="stylesheet" href="css/layout.css?v=20260509s" />
    <link rel="stylesheet" href="css/components.css?v=20260531supporters2" />
    <link rel="stylesheet" href="css/themes.css?v=20260509s" />
  </head>
  <body>
    <div id="boot-splash" role="status" aria-label="Chargement">
      <style>
        #boot-splash {
          position: fixed; z-index: 2147483000; left: 0; top: 0; width: 100%; height: 100%;
          display: -webkit-box; display: -webkit-flex; display: flex;
          -webkit-box-orient: vertical; -webkit-flex-direction: column; flex-direction: column;
          -webkit-box-align: center; -webkit-align-items: center; align-items: center;
          -webkit-box-pack: center; -webkit-justify-content: center; justify-content: center;
          background: #0c0b11;
          background: radial-gradient(ellipse at 50% 40%, #2a1f5c 0%, #120f22 55%, #08070c 100%);
          color: #fff; font-family: Arial, Helvetica, sans-serif;
          -webkit-transition: opacity 0.4s ease; transition: opacity 0.4s ease;
        }
        #boot-splash.is-hidden { opacity: 0; }
        #boot-splash .boot-splash-title { font-size: 96px; font-weight: 700; letter-spacing: 2px; }
        #boot-splash .boot-splash-subtitle { margin-top: 12px; font-size: 34px; color: #b9b2e6; letter-spacing: 6px; text-transform: uppercase; }
        #boot-splash .boot-splash-dots { margin-top: 64px; height: 18px; }
        #boot-splash .boot-splash-dots span {
          display: inline-block; width: 18px; height: 18px; margin: 0 10px; border-radius: 50%;
          background: #8a6cff; -webkit-animation: boot-splash-pulse 1.2s infinite ease-in-out; animation: boot-splash-pulse 1.2s infinite ease-in-out;
        }
        #boot-splash .boot-splash-dots span:nth-child(2) { -webkit-animation-delay: 0.2s; animation-delay: 0.2s; }
        #boot-splash .boot-splash-dots span:nth-child(3) { -webkit-animation-delay: 0.4s; animation-delay: 0.4s; }
        @-webkit-keyframes boot-splash-pulse { 0%, 80%, 100% { -webkit-transform: scale(0.5); opacity: 0.35; } 40% { -webkit-transform: scale(1); opacity: 1; } }
        @keyframes boot-splash-pulse { 0%, 80%, 100% { transform: scale(0.5); opacity: 0.35; } 40% { transform: scale(1); opacity: 1; } }
      </style>
      <div class="boot-splash-title">Stremio</div>
      <div class="boot-splash-subtitle">pour Tizen TV</div>
      <div class="boot-splash-dots"><span></span><span></span><span></span></div>
    </div>
    <script>
      (function () {
        var hidden = false;
        window.hideBootSplash = function () {
          var splash = document.getElementById("boot-splash");
          if (hidden || !splash) return;
          hidden = true;
          splash.className = "is-hidden";
          setTimeout(function () { if (splash.parentNode) splash.parentNode.removeChild(splash); }, 450);
        };
        // Never leave the TV stuck behind the splash if startup takes another route.
        setTimeout(window.hideBootSplash, 30000);
      })();
    </script>
    <script src="boot-guard.js"></script>
    <!-- Tizen fast path: deferred scripts keep document order but no longer
         parser-block first paint / focus-engine init on single-core TVs. -->
    <script
      defer
      src="core-js.bundle.js"
      onerror="window.NuvioBootGuard && window.NuvioBootGuard.scriptFailed(this.src)"
    ></script>
    <script defer src="nuvio.env.js"></script>

    <script defer src="assets/libs/qrcode-generator.js"></script>

    <script
      defer
      src="app.bundle.js?v=20260531supporters2"
      onerror="window.NuvioBootGuard && window.NuvioBootGuard.scriptFailed(this.src)"
    ></script>
  </body>
</html>
