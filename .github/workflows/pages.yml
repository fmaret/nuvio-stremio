name: Deploy to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci --ignore-scripts
      - run: node --test js/data/repository/stremioAccount.test.mjs
      - run: npm run build
      # index.html pins a fixed ?v= on the bundle; make each deploy fetch the new one.
      - run: sed -i "s/app\.bundle\.js?v=[^\"]*/app.bundle.js?v=${GITHUB_SHA::7}/" dist/index.html && grep -o 'app.bundle.js?v=[^"]*' dist/index.html
      - uses: actions/upload-pages-artifact@v3
        with:
          path: dist
      - id: deployment
        uses: actions/deploy-pages@v4
